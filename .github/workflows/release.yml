# Release assets (ADR-0001, PLAN.md D-10). On an app tag the workflow fetches the
# pack fonts from their pinned upstream sources (the one network step of the
# toolchain; hashes in fonts/manifest.json must match), builds the sidecar packs
# and edition zips, and attaches them with Unicode.html to the GitHub release
# for the tag. Standard needs nothing but Unicode.html.
name: release

on:
  push:
    tags: ["*-app"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-24.04 # pinned per engineering-standards C-19; review when Playwright supports the latest image (EXC-0004)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: fontTools for pack subsetting (PLAN.md D-20) and uharfbuzz for shaping parity (R-1)
        run: pip install -r tools/fonts/requirements.txt
      - name: Composed build
        run: npm run build
      - name: Committed artifact matches its sources
        run: npm run verify:regenerated
      - name: Fetch pinned pack fonts
        run: npm run fetch:fonts
      - name: Manifest unchanged by the fetch (hashes and measurements pinned)
        run: git diff --exit-code -- fonts/manifest.json
      - name: Build sidecar packs and edition zips
        run: npm run build:packs
      - name: Pack blocks unchanged by the build
        run: git diff --exit-code -- fonts/manifest.json
      - name: Shipped fonts shape like their full sources (Phase 10 R-1)
        run: npm run verify:shaping
      - name: Stage the hosted site (Unicode.html as index plus sidecar packs)
        run: |
          mkdir -p site
          cp Unicode.html site/index.html
          cp Unicode.html site/Unicode.html
          cp -r unicode-fonts site/unicode-fonts
          touch site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: site
          retention-days: 7
      - name: Create the GitHub release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(node -e "const s=require('fs').readFileSync('CHANGELOG.md','utf8');const v=process.env.GITHUB_REF_NAME.replace(/-app$/,'');const m=s.split(/^## /m).find(x=>x.startsWith('['+v+']'));process.stdout.write(m?('## '+m):'See CHANGELOG.md')")
          gh release create "$GITHUB_REF_NAME" Unicode.html dist/release/*.zip --title "Unicode Explorer app $GITHUB_REF_NAME" --notes "$notes"

  pages:
    # Hosted copy for bookmarking: Unicode.html at the site root plus the
    # sidecar packs built by the assets job, so Complete editions load on demand.
    needs: assets
    runs-on: ubuntu-24.04 # pinned per engineering-standards C-19 (EXC-0004)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
